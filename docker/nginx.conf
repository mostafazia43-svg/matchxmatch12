server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Telegram loads the Mini App in an iframe — do not send X-Frame-Options DENY.
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy no-referrer;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html must never be cached, or a deploy leaves clients on old assets.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A game socket is long-lived and mostly idle between rounds.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Buffering would delay the GO frame — the one thing that must not be delayed.
    proxy_buffering off;
  }

  location /health {
    proxy_pass http://backend:8080/health;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
