name: clickbattle

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clickbattle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clickbattle}
      POSTGRES_DB: ${POSTGRES_DB:-clickbattle}
      # Financial amounts are integers, but timestamps are not — pin the clock.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-clickbattle} -d ${POSTGRES_DB:-clickbattle}']
      interval: 5s
      timeout: 5s
      retries: 12
    command:
      - postgres
      - -c
      - max_connections=200

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-clickbattle}:${POSTGRES_PASSWORD:-clickbattle}@postgres:5432/${POSTGRES_DB:-clickbattle}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8080}:8080'

  bot:
    build:
      context: .
      dockerfile: docker/bot.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-clickbattle}:${POSTGRES_PASSWORD:-clickbattle}@postgres:5432/${POSTGRES_DB:-clickbattle}
    depends_on:
      postgres:
        condition: service_healthy
      # The bot reads tables the backend migrates, so let the backend go first.
      backend:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-8081}:80'

volumes:
  pgdata:
  redisdata:
